name: Deploy React Frontend
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install and Build
        run: |
          cd client
          npm install
          npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 62.72.13.242
          username: root
          password: "@0E7yr4n;GQ+;g2oo5jW"
          local-dir: ./client/dist/    # Vite projects usually build to 'dist' folder
          server-dir: ./public_html/
